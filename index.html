<!DOCTYPE html>
    <head>
        <title>PARADA: Parking Reservation System</title>

        <link rel="stylesheet" href="Design.css">
        <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
        <link rel="icon" type="image/png" href="img/Parada.png">
    </head>

    <body>
        <!--HEADER-->
        <div class="header">
            <div class="logo">
                <img src="Parada_icon.png" alt="PARADA logo ">
            </div>
            <div class="notif">
                <i class="fa-regular fa-bell"></i>
            </div>
        </div>

        <!-- MAIN MENU -->
        <main>
            <section id="home" class="page pageActive">
            <h1>Home</h1>
            <div class="slotCard" id="slotCard">
                <div class="slotTop">
                    <span>Parking available</span>
                    <span class="slotCount">
                        <b id="slotAvailable"></b>/<span id="slotTotal"></span>
                    </span>
                </div>
                <div class="slotBar">
                    <div class="slotBarFill" id="slotBarFill"></div>
                </div>
                <span class="slotStatus" id="slotStatus">Loading...</span>
            </div>
        </section>

        <section id="campus" class="page">
            <h1>Campus</h1>
        </section>

        <section id="ticket" class="page">
            <h1>Ticket</h1>
        </section>

        <section id="history" class="page">
            <h1>History</h1>
        </section>

        <section id="settings" class="page">
            <h1>Settings</h1>
        </section>
    </main>

        <!-- NAV BABA -->
    <div class="navLinks">
        <nav>
            <ul>
                <li class="home">
                    <a href="#home" data-target="home" class="navActive">
                        <i class="material-icons-outlined">home</i>
                        <span>Home</span>
                    </a>
                </li>

                <li class="campus">
                    <a href="#campus" data-target="campus">
                        <i class="material-icons-outlined">map</i>
                        <span>Campus</span>
                    </a>
                </li>

                <li class="ticket">
                    <a href="#ticket" data-target="ticket">
                        <i class="material-icons-outlined">confirmation_number</i>
                        <span>Ticket</span>
                    </a>
                </li>

                <li class="history">
                    <a href="#history" data-target="history">
                        <i class="material-icons-outlined">history</i>
                        <span>History</span>
                    </a>
                </li>

                <li class="settings">
                    <a href="#settings" data-target="settings">
                        <i class="material-icons-outlined">settings</i>
                        <span>Settings</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
    </body>
</html>
